<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WordCounter — count words, characters, sentences, paragraphs, reading time and more. 100% in your browser.">
  <title>WordCounter — Count Words &amp; Characters</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300a99b'/%3E%3Ctext x='32' y='46' font-size='36' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='Georgia,serif'%3E%3D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../" aria-label="Micro tools home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="22" height="22">
            <rect width="64" height="64" rx="14" fill="#00a99b"/>
            <text x="32" y="46" font-size="36" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Georgia,serif">W</text>
          </svg>
        </span>
        <span class="brand-name">Word<span>Counter</span></span>
      </a>
      <a class="back-link" href="../">← All tools</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 class="hero-title">Word &amp; character <span class="accent">counter</span></h1>
      <p class="hero-sub">Paste or type your text below and get instant stats — words, characters, sentences, paragraphs and reading time.</p>

      <div class="panel">
        <textarea id="inputText" class="text-input" rows="14" placeholder="Type or paste your text here..." spellcheck="false"></textarea>
        <div class="stat-grid" id="statGrid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-top"><strong>WordCounter</strong><span>100% client-side · nothing leaves this device</span></div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
