<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PassGen — generate strong random passwords with custom length and character sets. 100% in your browser, nothing is transmitted.">
  <title>PassGen — Password Generator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300a99b'/%3E%3Ccircle cx='32' cy='30' r='8' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M32 36v10' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../" aria-label="Micro tools home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="22" height="22">
            <rect width="64" height="64" rx="14" fill="#00a99b"/>
            <circle cx="32" cy="30" r="8" fill="none" stroke="#fff" stroke-width="5"/>
            <path d="M32 36v10" stroke="#fff" stroke-width="5"/>
          </svg>
        </span>
        <span class="brand-name">Pass<span>Gen</span></span>
      </a>
      <a class="back-link" href="../">← All tools</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 class="hero-title">Strong <span class="accent">password</span> generator</h1>
      <p class="hero-sub">Generate secure, random passwords. Customizable length and character sets — generated entirely on your device.</p>

      <div class="panel">
        <div class="password-box">
          <input type="text" id="passwordField" class="password-field" readonly aria-label="Generated password">
          <button type="button" id="copyBtn" class="btn btn-secondary">Copy</button>
          <button type="button" id="regenerateBtn" class="btn btn-ghost">↻</button>
        </div>

        <div class="options">
          <div class="opt-row">
            <label for="lengthRange">Length: <span id="lengthVal" class="val">16</span></label>
            <input type="range" id="lengthRange" min="4" max="64" value="16">
          </div>

          <div class="opt-row cols">
            <label class="check"><input type="checkbox" id="uc" checked> Uppercase (A–Z)</label>
            <label class="check"><input type="checkbox" id="lc" checked> Lowercase (a–z)</label>
            <label class="check"><input type="checkbox" id="num" checked> Numbers (0–9)</label>
            <label class="check"><input type="checkbox" id="sym" checked> Symbols (!@#$…)</label>
            <label class="check"><input type="checkbox" id="ambiguous"> Exclude ambiguous (Il1O0)</label>
          </div>

          <div class="opt-row">
            <label class="field-inline" for="countSel">How many passwords?</label>
            <select id="countSel">
              <option value="1" selected>1</option>
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
            </select>
          </div>
        </div>

        <div id="batchResults" class="batch-results hidden"></div>

        <div class="actions">
          <button type="button" id="generateBtn" class="btn btn-primary btn-lg">Generate</button>
          <button type="button" id="downloadBtn" class="btn btn-secondary btn-lg">Export .txt</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-top"><strong>PassGen</strong><span>100% client-side · nothing leaves this device</span></div>
  </footer>

  <div id="toastHost" class="toast-host" aria-live="assertive"></div>

  <script src="js/app.js"></script>
</body>
</html>
