<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RandNum — generate random numbers, with or without duplicates, between any range. 100% in your browser.">
  <title>RandNum — Random Number Generator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300a99b'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='Menlo,monospace'%3E%3D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../" aria-label="Micro tools home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="22" height="22">
            <rect width="64" height="64" rx="14" fill="#00a99b"/>
            <text x="32" y="46" font-size="40" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Menlo,monospace">≠</text>
          </svg>
        </span>
        <span class="brand-name">Rand<span>Num</span></span>
      </a>
      <a class="back-link" href="../">← All tools</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 class="hero-title">Random number <span class="accent">generator</span></h1>
      <p class="hero-sub">Pick a range, choose how many numbers you need, and whether duplicates are allowed.</p>

      <div class="panel">
        <div class="controls">
          <div class="field">
            <label class="field-label" for="minVal">Minimum</label>
            <input type="number" id="minVal" class="field-number" value="1">
          </div>
          <div class="field">
            <label class="field-label" for="maxVal">Maximum</label>
            <input type="number" id="maxVal" class="field-number" value="100">
          </div>
          <div class="field">
            <label class="field-label" for="countSel">How many</label>
            <input type="number" id="countSel" class="field-number" value="5" min="1">
          </div>
          <div class="field">
            <label class="check"><input type="checkbox" id="noDup"> No duplicates</label>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="generateBtn" class="btn btn-primary btn-lg">Generate</button>
          <button type="button" id="copyBtn" class="btn btn-secondary btn-lg">Copy</button>
        </div>

        <div id="resultBox" class="result-box hidden"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-top"><strong>RandNum</strong><span>100% client-side · nothing leaves this device</span></div>
  </footer>

  <div id="toastHost" class="toast-host" aria-live="assertive"></div>

  <script src="js/app.js"></script>
</body>
</html>
